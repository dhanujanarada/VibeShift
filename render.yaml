services:
  - type: web
    name: vibeshift
    env: python
    plan: free
    pythonVersion: 3.10
    buildCommand: |
      apt-get update && apt-get install -y fluidsynth
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="/root/.local/bin:$PATH"
      uv sync
    startCommand: |
      export PATH="/root/.local/bin:$PATH"
      uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
