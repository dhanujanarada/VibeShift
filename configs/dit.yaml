# DiT Model Configuration
# Diffusion Transformer for genre transformation with flow matching
# Optimized for ~30s audio clips with fast testing

dit_model:
  patch_dim: 512       # patch_height * patch_width = 8 * 64
  embed_dim: 256       # small but sufficient for testing
  num_blocks: 4        # shallow for fast training
  num_heads: 8
  num_genres: 2
  hidden_dim: 1024     # 4x embed_dim
  dropout: 0.1
  patch_height: 8      # n_mels/8 = 16 patches vertically
  patch_width: 64      # 1280/64 = 20 patches horizontally

# DiTBlock specific parameters
dit_block:
  # Inherited from model config above
  # dim: embed_dim
  # num_heads: num_heads
  # num_genres: num_genres
  # hidden_dim: hidden_dim
  # dropout: dropout

training:
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 1e-5
  epochs: 100
  patch_height: 8
  patch_width: 64      # larger patches for 30s audio
  
  # Audio processing (30s clips)
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  target_frames: 1280  # ~27s at 24kHz (close to 30s)
