# DiT Model Configuration
# Diffusion Transformer for genre transformation with flow matching

dit_model:
  dit_model:
  patch_dim: 640       # patch_height * patch_width = 10 * 64
  embed_dim: 768
  num_blocks: 12
  num_heads: 12
  num_genres: 2
  hidden_dim: 3072
  dropout: 0.1
  patch_height: 10     # 100 n_mels / 10 = 10 patches vertically
  patch_width: 64      # ~2811 / 64 = 44 patches (will pad to 2816)

# DiTBlock specific parameters
dit_block:
  # Inherited from model config above
  # dim: embed_dim
  # num_heads: num_heads
  # num_genres: num_genres
  # hidden_dim: hidden_dim
  # dropout: dropout

training:
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 1e-5
  epochs: 100
  patch_height: 8
  patch_width: 8
  
  # Audio processing
  n_mels: 128
  n_fft: 2048
  hop_length: 512
