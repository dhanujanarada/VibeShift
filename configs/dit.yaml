# DiT Model Configuration
# Diffusion Transformer for genre transformation with flow matching

dit_model:
  # Input patch dimension
  patch_dim: 512
  
  # Embedding dimension
  embed_dim: 512
  
  # Number of transformer blocks
  num_blocks: 12
  
  # Number of attention heads
  num_heads: 8
  
  # Number of genres
  num_genres: 2
  
  # Hidden dimension for MLP layers
  hidden_dim: 2048
  
  # Dropout rate
  dropout: 0.1

# DiTBlock specific parameters
dit_block:
  # Inherited from model config above
  # dim: embed_dim
  # num_heads: num_heads
  # num_genres: num_genres
  # hidden_dim: hidden_dim
  # dropout: dropout

training:
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 1e-5
  epochs: 100
  patch_height: 8
  patch_width: 8
  
  # Audio processing
  n_mels: 128
  n_fft: 2048
  hop_length: 512
