[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeshift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "basic-pitch>=0.4.0",
    "datasets>=4.4.2",
    "descript-audio-codec>=1.0.0",
    "descript-audiotools>=0.7.2",
    "fastapi>=0.128.0",
    "ffmpeg-python>=0.2.0",
    "fluidsynth>=0.2",
    "frechet-audio-distance>=0.1.2",
    "huggingface-hub>=1.3.1",
    "ipython>=8.38.0",
    "ipywidgets>=8.1.8",
    "jinja2>=3.1.6",
    "kagglehub>=0.4.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "midi2audio>=0.1.1",
    "mido>=1.3.3",
    "music21>=9.9.1",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pydub>=0.25.1",
    "pyloudnorm>=0.2.0",
    "pysynth>=0.0.4",
    "python-multipart>=0.0.22",
    "setuptools>=80.10.2",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "torch==2.9",
    "torchaudio>=2.9.0",
    "torchcodec>=0.9.1",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
    "uvicorn>=0.40.0",
    "vocos>=0.1.0",
    "wandb>=0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["models", "utills", "training", "test", "data", "configs"]
