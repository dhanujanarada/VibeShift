[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeshift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "datasets>=4.4.2",
    "ffmpeg-python>=0.2.0",
    "ipython>=8.38.0",
    "kagglehub>=0.4.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pydub>=0.25.1",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "torch==2.9",
    "torchaudio>=2.9.0",
    "torchcodec>=0.9.1",
    "tqdm>=4.67.1",
]

[tool.hatch.build.targets.wheel]
packages = ["models", "utills", "training", "test", "data", "configs"]
